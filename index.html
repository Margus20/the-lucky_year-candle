<body>

<canvas id="fuegosCanvas"></canvas>
<div id="yearReveal"></div>

<a href="https://ko-fi.com/mar_gus" target="_blank" class="donate-btn">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>

  Donate
</a>

<div class="escena">
  <div class="vela-wrapper">
    <div class="vela-contenedor">
      <div class="vela-fantasma"></div>
      <div class="vela" id="vela">
        <div class="mecha"></div>
        <div class="llama-container" id="llamaContainer">
          <div class="llama"></div>
        </div>
        <div class="gota gota-1"></div>
        <div class="gota gota-2"></div>
        <div class="gota gota-3"></div>
        <div class="gota gota-4"></div>
      </div>
    </div>
    <div class="base"></div>
  </div>

  <div class="anio" id="anioTexto">2026</div>

  <div class="contador" id="contador">
    <div class="contador-grupo">
      <span class="numero" id="dias">00</span>
      <span class="etiqueta">Days</span>
    </div>
    <div class="contador-grupo">
      <span class="numero" id="horas">00</span>
      <span class="etiqueta">Hours</span>
    </div>
    <div class="contador-grupo">
      <span class="numero" id="minutos">00</span>
      <span class="etiqueta">Minutes</span>
    </div>
    <div class="contador-grupo">
      <span class="numero" id="segundos">00</span>
      <span class="etiqueta">Seconds</span>
    </div>
  </div>
</div>
