<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Year Candle</title>
<link rel="icon" type="image/jpeg" href="1794442913870.jpg">
<link rel="stylesheet" href="css/style.css">

<!-- Metaetiquetas para redes sociales (Open Graph) -->
<meta property="og:title" content="The Year Candle – Watch the year burn down">
<meta property="og:description" content="A candle that burns down second by second as the year passes. See exactly how much time is left until the New Year.">
<meta property="og:image" content="https://margus20.github.io/the-lucky_year-candle/1794442913870.jpg">
<meta property="og:url" content="https://margus20.github.io/the-lucky_year-candle/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Year Candle">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Year Candle – Watch the year burn down">
<meta name="twitter:description" content="A candle that burns down second by second as the year passes.">
<meta name="twitter:image" content="https://margus20.github.io/the-lucky_year-candle/1794442913870.jpg">
</head>
<body>

<canvas id="fuegosCanvas"></canvas>
<div id="yearReveal"></div>

<!-- BOTÓN DE DONAR (ahora es un botón que abre opciones) -->
<button id="donateBtn" class="donate-btn" aria-label="Support options">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
  Donate
</button>

<!-- PANEL DE OPCIONES DE DONACIÓN (oculto por defecto) -->
<div id="donatePanel" class="donate-panel">
  <button class="donate-option kofi-option" id="kofiBtn">
    <span class="option-icon">☕</span>
    <span class="option-text">Ko-fi</span>
  </button>
  <button class="donate-option binance-option" id="binanceBtn">
    <span class="option-icon">🟡</span>
    <span class="option-text">Binance Pay</span>
  </button>
</div>

<!-- MODAL DEL CÓDIGO QR DE BINANCE (oculto por defecto) -->
<div id="qrModal" class="qr-modal">
  <div class="qr-modal-content">
    <button class="qr-close" id="qrClose" aria-label="Close">✕</button>
    <h3 class="qr-title">Scan with Binance App</h3>
    <img src="https://margus20.github.io/decoracion-navidad/img/binance_pay_qr.png" alt="Binance Pay QR Code" class="qr-image">
    <p class="qr-note">Open your Binance app and scan this code to send support.</p>
  </div>
</div>

<div class="escena">
  <div class="vela-wrapper">
    <div class="vela-contenedor">
      <div class="vela-fantasma"></div>
      <div class="vela" id="vela">
        <div class="mecha"></div>
        <div class="llama-container" id="llamaContainer">
          <div class="llama"></div>
        </div>
        <div class="gota gota-1"></div>
        <div class="gota gota-2"></div>
        <div class="gota gota-3"></div>
        <div class="gota gota-4"></div>
      </div>
    </div>
    <div class="base"></div>
  </div>

  <div class="anio" id="anioTexto">2026</div>

  <div class="contador" id="contador">
    <div class="contador-grupo">
      <span class="numero" id="dias">00</span>
      <span class="etiqueta">Days</span>
    </div>
    <div class="contador-grupo">
      <span class="numero" id="horas">00</span>
      <span class="etiqueta">Hours</span>
    </div>
    <div class="contador-grupo">
      <span class="numero" id="minutos">00</span>
      <span class="etiqueta">Minutes</span>
    </div>
    <div class="contador-grupo">
      <span class="numero" id="segundos">00</span>
      <span class="etiqueta">Seconds</span>
    </div>
  </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
